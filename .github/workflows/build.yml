name: Build

on:
  push:
    branches:
      - master

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract versions from .tool-versions and AWS account ID
        id: versions
        run: |
          erlang_version=$(grep 'erlang' .tool-versions | awk '{print $2}')
          elixir_version=$(grep 'elixir' .tool-versions | awk '{print $2}')
          aws_account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "erlang=$erlang_version" >> $GITHUB_OUTPUT
          echo "elixir=$elixir_version" >> $GITHUB_OUTPUT
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.versions.outputs.erlang }}
          elixir-version: ${{ steps.versions.outputs.elixir }}

      - name: Cache Elixir dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache Elixir build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'lib/**', 'test/**', 'mix.exs') }}-${{ steps.versions.outputs.erlang }}-${{ steps.versions.outputs.elixir }}
          restore-keys: |
            ${{ runner.os }}-build-

      - run: mix deps.get

      - run: mix assets.deploy

      - name: Build OTP release
        run: MIX_ENV=prod mix release
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}

      - name: Archive release
        run: tar -czf chess-${{ github.sha }}.tar.gz _build/prod/rel/chess

      - name: Upload release to S3
        run: aws s3 cp chess-${{ github.sha }}.tar.gz s3://chess-releases-${{ steps.versions.outputs.aws_account_id }}/chess-${{ github.sha }}.tar.gz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      - name: Write env file on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          cat > /tmp/chess.env << EOF
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          PHX_SERVER=true
          PORT=80
          PHX_HOST=$EC2_HOST
          EOF
          scp -o StrictHostKeyChecking=no -i /tmp/ec2_key \
            /tmp/chess.env deploy@"$EC2_HOST":/home/deploy/.chess.env
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key deploy@"$EC2_HOST" \
            chmod 600 /home/deploy/.chess.env

      - name: Deploy release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key deploy@"$EC2_HOST" bash -s -- "${{ github.sha }}" << 'ENDSSH'
          set -euo pipefail
          SHA=$1
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="chess-releases-$AWS_ACCOUNT_ID"
          RELEASE_DIR="/home/deploy/releases/$SHA"

          mkdir -p "$RELEASE_DIR"
          aws s3 cp "s3://$BUCKET/chess-$SHA.tar.gz" "/tmp/chess-$SHA.tar.gz"
          tar -xzf "/tmp/chess-$SHA.tar.gz" -C "$RELEASE_DIR" --strip-components=4
          rm "/tmp/chess-$SHA.tar.gz"

          ln -sfn "$RELEASE_DIR" /home/deploy/current

          sudo systemctl enable chess
          sudo systemctl restart chess
          ENDSSH
