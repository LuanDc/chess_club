#cloud-config

# Create the deploy user used to run the application
users:
  - default
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

# Disable password-based SSH authentication
write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no

  - path: /usr/local/bin/setup-deploy-ssh.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      mkdir -p /home/deploy/.ssh
      cp /home/ubuntu/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
      chown -R deploy:deploy /home/deploy/.ssh
      chmod 700 /home/deploy/.ssh
      chmod 600 /home/deploy/.ssh/authorized_keys

  - path: /etc/systemd/system/chess.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Chess Game
      After=network.target
      ConditionPathExists=/home/deploy/current/bin/chess

      [Service]
      Type=simple
      User=deploy
      Group=deploy
      WorkingDirectory=/home/deploy/current
      EnvironmentFile=/home/deploy/.chess.env
      ExecStart=/home/deploy/current/bin/chess foreground
      ExecStop=/home/deploy/current/bin/chess stop
      Restart=on-failure
      RestartSec=5
      AmbientCapabilities=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target


# Install build dependencies required by asdf-erlang to compile OTP from source
packages:
  - git
  - curl
  - build-essential
  - autoconf
  - m4
  - libncurses5-dev
  - libssl-dev
  - libssh-dev
  - unixodbc-dev
  - xsltproc
  - fop
  - libxml2-utils
  - libncurses-dev
  - awscli

package_update: true
package_upgrade: true

runcmd:
  # Ensure deploy user's home directory exists with correct permissions
  - mkdir -p /home/deploy
  - chown -R deploy:deploy /home/deploy
  - chmod 755 /home/deploy

  # Apply SSH hardening immediately
  - systemctl restart ssh

  # Copy ubuntu's authorized_keys to deploy user (allows same SSH key for GitHub Actions)
  - /usr/local/bin/setup-deploy-ssh.sh

  # Reload systemd to pick up the chess.service unit
  - systemctl daemon-reload

  # Install ASDF for the deploy user
  - su - deploy -c 'git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.14.0'
  - su - deploy -c 'echo ". \"$HOME/.asdf/asdf.sh\""           >> ~/.bashrc'
  - su - deploy -c 'echo ". \"$HOME/.asdf/completions/asdf.bash\"" >> ~/.bashrc'

  # Create tool-versions file
  - su - deploy -c "cat > ~/.tool-versions << 'EOF'
erlang ${erlang_version}
elixir ${elixir_version}
EOF"

  # Install ASDF plugins
  - su - deploy -c '. ~/.asdf/asdf.sh && asdf plugin add erlang https://github.com/asdf-vm/asdf-erlang.git'
  - su - deploy -c '. ~/.asdf/asdf.sh && asdf plugin add elixir https://github.com/asdf-vm/asdf-elixir.git'

  # Build OTP from source (skipping wx/observer/debugger to reduce build time)
  - >
    su - deploy -c '
      export KERL_CONFIGURE_OPTIONS="--without-javac --without-wx --without-debugger --without-observer --without-et";
      . ~/.asdf/asdf.sh && asdf install erlang ${erlang_version}
    '

  # Install Elixir (uses precompiled binaries from GitHub releases)
  - su - deploy -c '. ~/.asdf/asdf.sh && asdf install elixir ${elixir_version}'

  # Set global defaults so iex/elixir work from any directory
  - su - deploy -c '. ~/.asdf/asdf.sh && asdf global erlang ${erlang_version}'
  - su - deploy -c '. ~/.asdf/asdf.sh && asdf global elixir ${elixir_version}'

  # Write a marker file so you can verify cloud-init completed successfully
  - su - deploy -c '. ~/.asdf/asdf.sh && iex --version > /home/deploy/version-check.txt 2>&1'
  - su - deploy -c '. ~/.asdf/asdf.sh && elixir --version >> /home/deploy/version-check.txt 2>&1'
