# fly.toml app configuration file generated for chess-battle-app on 2026-05-08T19:15:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chess-battle-app'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PHX_HOST = 'chess-battle-app.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']


[[vm]]
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
